[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-prov"
version = "0.1.0"
description = "Provenance tracking tool"
authors = [
    { name="Yuyan", email="yuyan_zhao@outlook.com" }
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/yuyan-z/tensor_prov"
Repository = "https://github.com/yuyan-z/tensor_prov"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tensor_prov*"]
